<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход / регистрация — КУЧЕР СТРОЙ</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="features.css"></head><body data-page="auth"><header class="site-header"></header><main class="section"><div class="wrap"><div class="auth-wrap"><section class="panel auth-card"><div class="section-heading"><div><span class="eyebrow eyebrow-dark">Kucher</span><h1>Личный кабинет</h1><p>Войдите или зарегистрируйтесь по email либо номеру телефона.</p></div></div><div class="auth-tabs"><button class="auth-tab active" type="button" data-auth-tab="login">Войти</button><button class="auth-tab" type="button" data-auth-tab="register">Регистрация</button></div><form id="login-form" class="auth-form"><label>Email или телефон<input name="identifier" type="text" autocomplete="username" placeholder="email@example.ru или +7 (___) ___-__-__" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" placeholder="Пароль" required></label><button class="button button-primary" type="submit">Войти</button><p id="login-error" class="auth-error" hidden></p></form><form id="register-form" class="auth-form" hidden><label>Имя<input name="name" type="text" autocomplete="name" placeholder="Ваше имя"></label><label>Email или телефон<input name="identifier" type="text" autocomplete="username" placeholder="email@example.ru или +7 (___) ___-__-__" required></label><label>Пароль<input name="password" type="password" autocomplete="new-password" placeholder="Минимум 6 символов" required></label><label>Повторите пароль<input name="password2" type="password" autocomplete="new-password" placeholder="Пароль ещё раз" required></label><button class="button button-primary" type="submit">Создать аккаунт</button><p id="register-error" class="auth-error" hidden></p><p id="register-success" class="form-success" hidden>Аккаунт создан. Входим…</p></form><p class="auth-note">Сейчас это прототип: данные аккаунта хранятся в браузере. Для production-релиза авторизацию нужно перенести на backend и PostgreSQL.</p></section></div></div></main><footer class="site-footer"></footer><script src="products.js"></script><script src="app.js"></script></body></html>

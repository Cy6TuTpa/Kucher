<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Корзина товаров и оформление заказа Кучер строй."><title>Корзина — Кучер строй</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="features.css"></head>
<body data-page="cart"><header class="site-header"></header><main class="section"><div class="wrap"><div class="cart-heading"><h1>Корзина</h1><button id="clear-cart" class="button button-danger" type="button">Удалить всё</button></div><p id="cart-empty" class="empty" hidden>Корзина пуста. <a href="catalog.html">Перейти в каталог</a></p><div id="cart-content" class="cart-layout"><section id="cart-items" class="panel"></section><aside class="panel order-summary"><h2>Ваш заказ</h2><div class="total-row"><span>Товары</span><b id="cart-total"></b></div><a class="button button-primary" href="cabinet.html">Оформить в личном кабинете</a><a class="button choice-secondary" href="catalog.html">Продолжить покупки</a><p class="notice">Демонстрационные цены и остатки хранятся в локальном браузере.</p></aside></div><section id="cart-manager-contact" class="panel cart-manager-contact"><div><h2>Нужна помощь с заказом?</h2><p>Оставьте номер телефона — заявка сохранится в этом браузере. Аккаунт для этого не нужен.</p></div><button id="show-cart-manager-form" type="button" class="button button-secondary">Заказать через менеджера</button><form id="cart-manager-form" class="manager-form" hidden><div class="manager-form-grid"><label>Телефон для связи<input name="phone" type="tel" autocomplete="tel" placeholder="+7 (___) ___-__-__" required maxlength="30"></label><label>Имя <span class="optional">необязательно</span><input name="name" type="text" autocomplete="name" placeholder="Как к вам обращаться" maxlength="100"></label><label class="manager-comment">Комментарий <span class="optional">необязательно</span><textarea name="comment" maxlength="500" rows="3" placeholder="Что нужно уточнить менеджеру"></textarea></label></div><p data-manager-success class="form-success" role="status" hidden></p><p data-manager-error class="auth-error" role="alert" hidden></p><button class="button button-primary" type="submit">Отправить заявку</button></form></section></div></main><footer class="site-footer"></footer><script src="products.js"></script><script src="config.js"></script><script src="app.js"></script></body>
</html>
